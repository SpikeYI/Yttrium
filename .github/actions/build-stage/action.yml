name: 'Build stage'
description: 'One relay stage: reclaim disk, restore the tree, build within a time budget, save the tree or release'

inputs:
  architecture:
    required: true
  chromium_source:
    required: true
  source_run_id:
    required: false
    default: ''
  threads:
    required: false
    default: '0'
  keystore_b64:
    required: false
  keystore_pass:
    required: false

outputs:
  status:
    value: ${{ steps.build.outputs.status }}

runs:
  using: composite
  steps:
    - name: Prepare runner
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
      run: .github/scripts/hosted-prepare.sh

    - name: Restore build tree
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
        ARCH: ${{ inputs.architecture }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        GH_TOKEN: ${{ github.token }}
      run: .github/scripts/hosted-import.sh

    - name: Build
      id: build
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
        NINJA_TIMEOUT: '16200s'
        NINJA_JOBS: ${{ inputs.threads }}
        DEBIAN_FRONTEND: noninteractive
        CHROMIUM_SOURCE: ${{ inputs.chromium_source == 'github' && 'https://github.com/chromium/chromium.git' || 'https://chromium.googlesource.com/chromium/src.git' }}
      run: >
        .github/scripts/hosted-build.sh --install-deps --resume
        --arch "${{ inputs.architecture }}"
        --target chrome_modern_target

    - name: Pack build tree
      if: steps.build.outputs.status == 'running'
      shell: bash
      env:
        UGC_WORK: /mnt/ugc
        ARCH: ${{ inputs.architecture }}
      run: .github/scripts/hosted-export.sh

    - name: Save build tree
      if: steps.build.outputs.status == 'running'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-tree-${{ inputs.architecture }}.tar.zst
        path: build-tree-${{ inputs.architecture }}.tar.zst
        retention-days: 1
        overwrite: true
        archive: false

